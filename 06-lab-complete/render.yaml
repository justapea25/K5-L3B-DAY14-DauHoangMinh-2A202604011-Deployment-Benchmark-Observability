# ============================================================
# Render Blueprint (tiêu chí 12) — agent (Docker) + Render Key Value (Redis-compatible)
#   Tạo trên dashboard: New → Blueprint → chọn repo → Blueprint Path = 06-lab-complete/render.yaml
#   Đường dẫn bên dưới tính từ GỐC repo (file này nằm trong thư mục con 06-lab-complete/).
#   AGENT_API_KEY dùng `generateValue: true` → Render tự sinh key ngẫu nhiên, không ghi giá trị ở đây.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - 06-lab-complete/**
      ignoredPaths:
        - 06-lab-complete/benchmark-observability/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []   # không mở ra internet, chỉ service Render trong cùng tài khoản kết nối được
