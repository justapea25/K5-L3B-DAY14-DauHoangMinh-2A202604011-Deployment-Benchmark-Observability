# ============================================================
# Render Blueprint (tiêu chí 12) — thay thế cho railway.toml
#   Agent (Docker web service) + Render Key Value (Redis-compatible).
#   AGENT_API_KEY dùng `sync: false` → điền trên dashboard, không ghi giá trị ở đây.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []   # chỉ cho phép kết nối nội bộ từ các service Render
