# ============================================================
# Railway deploy config (tiêu chí 12)
#   Build bằng Dockerfile; Railway cấp biến PORT, CMD trong Dockerfile đã đọc ${PORT}.
#   Secret (AGENT_API_KEY) và REDIS_URL đặt bằng `railway variables`, KHÔNG ghi ở đây.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
